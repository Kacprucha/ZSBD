services:
  postgres:
    image: postgres:16
    container_name: rpg_postgres
    environment:
      POSTGRES_USER: rpg_admin
      POSTGRES_PASSWORD: rpg_admin_password
      POSTGRES_DB: rpg_game_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_scripts:/docker-entrypoint-initdb.d 
    restart: unless-stopped

volumes:
  postgres_data: